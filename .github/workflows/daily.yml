name: Daily Workout Pipeline

on:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:
    inputs:
      backfill_date:
        description: "Backfill a specific date (YYYY-MM-DD) instead of today"
        required: false
        type: string
      skip_db_save:
        description: "Skip database persistence (analysis + Discord only)"
        required: false
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          LYFTA_API_KEY: ${{ secrets.LYFTA_API_KEY }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TONE: ${{ vars.TONE || 'balanced' }}
          BACKFILL_DATE: ${{ inputs.backfill_date }}
          SKIP_DB_SAVE: ${{ inputs.skip_db_save }}
        run: |
          python src/main.py
